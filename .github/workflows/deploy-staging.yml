# Staging deploy: ship ANY ref (a branch, a PR head, a tag) to the `pachinball-staging` project on the
# storage manager, then check what the staging host serves. Production is deploy.yml and is untouched:
# this workflow never uploads to the `pachinball` project and has no path to it (DEPLOY_PROJECT_NAME is
# pinned below). See docs/STAGING.md for the server-side requirements (COOP/COEP, `.wasm` MIME).
#
#   pinned emsdk → npm run build → check:dist-wasm → check:bundle → check-dist-console
#   → deploy.py (project pachinball-staging) → verify-live (STAGING_URL) → state-of-app capture
#
# Run it: Actions → "Deploy staging" → Run workflow → pick the ref.
#
# Configuration (repository → Settings → Environments → `staging`):
#   secret   DEPLOY_TOKEN   the storage manager's deploy token (same service as production)
#   variable STAGING_URL    where the host serves the project, e.g. https://test.1ink.us/pachinball-staging/
#   (optional) variable DEPLOY_BASE_URL   default https://storage.noahcohn.com

name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and check everything, print the transfer plan, upload nothing'
        type: boolean
        default: false

permissions:
  contents: read

# One staging deploy at a time; never cancel one halfway through an upload.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  staging:
    name: build, gate, deploy to staging, verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: staging
    env:
      DEPLOY_PROJECT_NAME: pachinball-staging
      DEPLOY_TARGET_FOLDER: pachinball-staging
      DRY_RUN: ${{ inputs.dry_run == true }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up the pinned Emscripten SDK
        uses: ./.github/actions/setup-emsdk

      - name: Production build
        env:
          CI: 'true'
        run: |
          source emsdk/emsdk_env.sh
          npm run build
          cat dist/build-info.json

      - name: dist/wasm matches public/wasm
        run: npm run check:dist-wasm

      - name: Bundle size gate
        run: npm run check:bundle

      - name: Production bundle keeps boot-error reporting
        run: node scripts/check-dist-console.mjs

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install deploy.py dependencies
        run: pip install requests

      # Refuse to run against production by accident: staging must be configured, and must not be
      # the production site (verify-live.mjs would otherwise fall back to its production default).
      - name: Staging target is configured and is not production
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "${DEPLOY_TOKEN}" ]; then
            echo "::error::secret DEPLOY_TOKEN is not set in the 'staging' environment"
            exit 1
          fi
          if [ -z "${STAGING_URL}" ]; then
            echo "::error::variable STAGING_URL is not set in the 'staging' environment (docs/STAGING.md)"
            exit 1
          fi
          case "${STAGING_URL}" in
            */pachinball|*/pachinball/)
              echo "::error::STAGING_URL points at the production project (${STAGING_URL})"
              exit 1;;
          esac
          [ "${DEPLOY_PROJECT_NAME}" != "pachinball" ] || { echo "::error::project is production"; exit 1; }

      - name: Transfer plan
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_BASE_URL: ${{ vars.DEPLOY_BASE_URL }}
        run: |
          python deploy.py --list-only
          python deploy.py --prune --dry-run

      - name: Upload to the storage manager (staging project)
        if: env.DRY_RUN != 'true'
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_BASE_URL: ${{ vars.DEPLOY_BASE_URL }}
        run: python deploy.py

      # build-info.json SHA + wasmSha256 match this build; COOP/COEP on index.html and the wasm;
      # `.wasm` is application/wasm; sw.js and every boot asset answer 200.
      - name: Verify the staging site
        if: env.DRY_RUN != 'true'
        env:
          LIVE_URL: ${{ vars.STAGING_URL }}
        run: node scripts/verify-live.mjs

      - name: Install Playwright Chromium
        if: env.DRY_RUN != 'true'
        run: npx playwright install --with-deps chromium

      - name: State of the App capture (console, menu + in-play screenshots, desktop and mobile)
        if: env.DRY_RUN != 'true'
        run: node scripts/state-of-app.mjs --url "${{ vars.STAGING_URL }}" --out state-of-app

      - name: Upload the capture
        if: always() && env.DRY_RUN != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: state-of-app-${{ github.sha }}
          path: state-of-app/
          retention-days: 30
          if-no-files-found: ignore
