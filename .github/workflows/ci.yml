name: CI

# Gate every PR and every push to main. Nothing landed on main should be red here.
# Mirrors the local swarm discipline (tsc -b, lint, vitest, build) so regressions are
# caught before merge rather than after a direct-to-main push.
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every job is pinned to ubuntu-24.04: `ubuntu-latest` moved to 26.04 on 2026-11-12, where
  # Playwright 1.57 cannot install Chromium's dependencies (#519). Move the pin deliberately.
  check:
    name: typecheck / lint / test / build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      # noUncheckedIndexedAccess ratchet (#441): src/core, src/wasm and src/game/physics are held
      # to the flag; the rest of src/ is reported as backlog.
      - name: Indexed-access ratchet
        run: npm run check:index-strict

      # `as unknown as` ratchet (#489): src/adventure is held to zero — track modules build through
      # TrackBuilderApi; the rest of src/ is reported as backlog.
      - name: Unknown-cast ratchet
        run: npm run check:unknown-casts

      # The voice AudioWorklet script in public/audio/ is build output of src/audio/pachinko-voice-processor.ts.
      - name: Worklet script drift
        run: npm run check:worklet

      - name: Lint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npx vitest run

      # NOTE: intentionally `vite build`, NOT `npm run build`.
      # `npm run build` chains `build:wasm` (scripts/build-wasm.sh), which needs Emscripten.
      # emcc is not installed here, so this only verifies the TS/Vite bundle compiles and links.
      # The bundle-size gate runs on the bundle that ships, the wasm=true preview leg (#519).
      - name: Build (bundle only, no WASM)
        run: npx vite build

  # Blocking smoke: desktop + mobile Playwright specs. A red e2e now blocks merges (#319).
  # The dev server is started by the `webServer` block in playwright.config.ts (5173,
  # --strictPort), so there is no inline `npm run dev &` poll here. Scope is kept to the known-stable smoke specs —
  # the blocking gate must stay deterministic, not run the entire *.spec.ts suite.
  e2e:
    name: playwright smoke (desktop + mobile, blocking)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Dev server without public/wasm — validates fail-closed Rapier degrade + marker.
      - name: Physics degrade (no WASM bundle)
        env:
          CI: 'true'
        run: |
          rm -rf public/wasm
          npx playwright test --config=playwright.degrade.config.ts

      # Playwright's webServer boots `npm run dev` on 5173 and waits for it. The chromium
      # project runs the desktop specs; the mobile-chrome project (Pixel 7 emulation) runs
      # the touch smoke — each spec is routed to the right project by testMatch/testIgnore.
      - name: Playwright smoke (desktop + mobile)
        env:
          CI: 'true'
        run: >
          npx playwright test
          --project=chromium
          --project=mobile-chrome
          tests/verify_prism_core.spec.ts
          tests/basic-gameplay.spec.ts
          tests/lifecycle-dispose.spec.ts
          tests/mobile-touch-smoke.spec.ts

      # The two WebGPU guards CLAUDE.md relies on (#519): a WebGPU boot compiles no GLSL (so it
      # never fetches glslang / twgsl from cdn.babylonjs.com), and the WebGPU boot reaches PLAYING.
      # Each launches its own SwiftShader-Vulkan browser.
      - name: Playwright WebGPU guards
        env:
          CI: 'true'
          WEBGPU_CI: '1'
        run: >
          npx playwright test
          --project=chromium
          tests/webgpu-no-glslang.spec.ts
          tests/webgpu-boot.spec.ts

      - name: Upload Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playwright-results
          path: test-results/
          retention-days: 7

  # Blocking smoke against the production bundle: `vite build` + `vite preview`, the desktop
  # smoke specs, twice. wasm=true builds the C++ bundle and expects the `wasm-owner` default;
  # wasm=false removes public/wasm and expects the fail-closed `rapier` path. The dev-server
  # `e2e` job never boots minified output (console/debugger drop, chunking), which is how
  # #449 / #452 slipped through. Mobile stays on the dev job.
  e2e-preview:
    name: playwright preview (built bundle, wasm=${{ matrix.wasm }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        wasm: [true, false]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The SDK pinned in .emsdk-version (from the emsdk commit in .emsdk-commit), never
      # `latest`: a bundle built here must be the one native-physics.yml checked for parity,
      # and a replay verified against it must verify against the next build too (#487).
      - name: Set up the pinned Emscripten SDK
        if: matrix.wasm
        uses: ./.github/actions/setup-emsdk

      - name: Build WASM module (Release)
        if: matrix.wasm
        env:
          CI: 'true'
        run: |
          source emsdk/emsdk_env.sh
          npm run build:wasm
          test -s public/wasm/PhysicsModule.wasm

      - name: Remove WASM bundle (fail-closed leg)
        if: ${{ !matrix.wasm }}
        run: rm -rf public/wasm

      - name: Build
        run: npx tsc -b && npx vite build

      # The bundle this job boots must carry the WASM just built, not a stale copy (#464 item 1).
      - name: dist/wasm matches public/wasm
        env:
          ALLOW_NO_WASM: ${{ !matrix.wasm && '1' || '' }}
        run: npm run check:dist-wasm

      - name: Production bundle keeps boot-error reporting
        run: node scripts/check-dist-console.mjs

      # Budgeted on the bundle that ships (C++ physics included), not a no-WASM build (#519):
      # also checks the WASM pair, the glTF loader and the GLBs are precached.
      - name: Bundle size gate
        if: matrix.wasm
        run: npm run check:bundle

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke (built bundle)
        env:
          CI: 'true'
          PREVIEW_EXPECT_ENGINE: ${{ matrix.wasm && 'wasm-owner' || 'rapier' }}
        run: >
          npx playwright test
          --config=playwright.preview.config.ts
          tests/preview-boot.spec.ts
          tests/preview-sw.spec.ts
          tests/offline-boot.spec.ts
          tests/preview-subdir.spec.ts
          tests/verify_prism_core.spec.ts
          tests/basic-gameplay.spec.ts
          tests/lifecycle-dispose.spec.ts

      - name: Upload Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: preview-playwright-results-wasm-${{ matrix.wasm }}
          path: test-results/
          retention-days: 7
