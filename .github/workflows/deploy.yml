# Deploy as code (#519 B): the one path from a green `main` commit (or a v* tag) to the live site.
#
#   pinned emsdk → npm run build → check:dist-wasm → check:bundle → preview smoke on both
#   renderers → deploy.py --list-only → deploy.py → verify-live → release:archive (artifact)
#
# Secrets (repository → Settings → Secrets and variables → Actions):
#   DEPLOY_TOKEN   the storage manager's deploy token (deploy.py sends it as X-Deploy-Token)
# Optional repository variables: DEPLOY_BASE_URL (default https://storage.noahcohn.com) and
# LIVE_URL (default https://test.1ink.us/pachinball/).
#
# The release archive (dist/ + golden tapes, replayed on the copy) is uploaded as an artifact; the
# replay verifier on the storage host installs it under $VERIFIER_BUILDS (docs/API_CONTRACT.md),
# so runs played on this release keep verifying after the next one ships.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and check everything, print the transfer plan, upload nothing'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read
  actions: read

# One deploy at a time; never cancel one halfway through an upload.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: build, gate, deploy, verify
    # Only main or a tag ships. A dispatch from another branch fails here, before any build.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v7

      # Ship only a commit both blocking workflows passed on: a red main is never deployed.
      - name: CI and Native Physics are green on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          for wf in ci.yml native-physics.yml; do
            conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/runs?head_sha=${SHA}&status=completed&per_page=1" --jq '.workflow_runs[0].conclusion // "none"')"
            echo "${wf}: ${conclusion}"
            if [ "${conclusion}" != "success" ]; then
              echo "::error::${wf} is '${conclusion}' on ${SHA}; deploy only a green commit"
              exit 1
            fi
          done

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up the pinned Emscripten SDK
        uses: ./.github/actions/setup-emsdk

      # tsc -b → build:wasm (fails on any emcc but the pin) → vite build → dist/build-info.json
      - name: Production build
        env:
          CI: 'true'
        run: |
          source emsdk/emsdk_env.sh
          npm run build
          cat dist/build-info.json
          if grep -q -- '-dirty' dist/build-info.json; then
            echo "::error::the build is dirty; a deployed build must be a commit"
            exit 1
          fi

      - name: dist/wasm matches public/wasm
        run: npm run check:dist-wasm

      - name: Bundle size gate
        run: npm run check:bundle

      - name: Production bundle keeps boot-error reporting
        run: node scripts/check-dist-console.mjs

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The built bundle on WebGL2 (the preview smoke set) and on WebGPU (a WebGPU boot that
      # compiles no GLSL), the same specs ci.yml blocks on.
      - name: Preview smoke (WebGL2, built bundle)
        env:
          CI: 'true'
          PREVIEW_EXPECT_ENGINE: wasm-owner
        run: >
          npx playwright test --config=playwright.preview.config.ts
          tests/preview-boot.spec.ts tests/preview-sw.spec.ts tests/offline-boot.spec.ts
          tests/preview-subdir.spec.ts tests/basic-gameplay.spec.ts

      - name: Smoke (WebGPU)
        env:
          CI: 'true'
        run: npx playwright test --project=chromium tests/webgpu-boot.spec.ts tests/webgpu-no-glslang.spec.ts

      - name: Archive the release for the replay verifier (replays the goldens on the copy)
        run: npm run release:archive -- --to release-archive

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install deploy.py dependencies
        run: pip install requests

      - name: Transfer plan
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_BASE_URL: ${{ vars.DEPLOY_BASE_URL }}
        run: |
          if [ -z "${DEPLOY_TOKEN}" ]; then
            echo "::error::secret DEPLOY_TOKEN is not set (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          python deploy.py --list-only
          python deploy.py --prune --dry-run

      - name: Upload to the storage manager
        if: ${{ !inputs.dry_run }}
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_BASE_URL: ${{ vars.DEPLOY_BASE_URL }}
        run: python deploy.py

      # The live site serves this commit's build-info and binary, with the isolation headers
      # wasm-worker needs (they come from the server config, not from this repository).
      - name: Verify the live site
        if: ${{ !inputs.dry_run }}
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
        run: node scripts/verify-live.mjs

      - name: Upload the release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.sha }}
          path: release-archive/
          retention-days: 90

      - name: Upload Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: deploy-playwright-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
