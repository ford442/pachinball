# Native C++ physics Catch2 unit tests + blocking WASM build/parity verification.
#
# native_ctest + sanitizer_ctest are BLOCKING for PRs touching `native/**`.
# native_release_ctest + native_arm64_ctest run the same Catch2 suite at -O3 and
# on aarch64 (non-blocking for their first week).
# wasm_parity is BLOCKING for PRs touching `native/**`, `src/wasm/**`, or wasm tests.
# replay_goldens is BLOCKING for the same paths plus `src/game/physics/**`,
# `src/replay/**` and the replay verifier: every tests/replays/*.json tape must
# replay to its golden final state hash, score and step count, and the
# storage-host verifier must pass its self-test (#444). An intentional numeric change
# runs `npm run verify:replay -- --update` and commits the new goldens with a
# one-line rationale.
# JS-only PRs outside those paths are not gated on Emscripten.
#
# Skip triggers:
#   - workflow_dispatch for manual runs
#   - Commit message containing "[skip wasm-ci]" skips the wasm_parity job
#
# Local equivalents:
#   npm run compile-db           # configure only → native/build-native/compile_commands.json
#   npm run test:native          # compile-db + Catch2 + ctest (g++/cmake only)
#   npm run test:native:release  # same at -O3 (native/build-release) — native_release_ctest, native_arm64_ctest
#   CXX=clang++ npm run test:native:san  # same under ASan/UBSan + float-cast-overflow (native/build-san), no recovery
#   npm run check:compile-db     # clangd DB smoke (after compile-db)
#   npm run check:wasm-docs      # docs/wasm-physics-engine.md drift check
#   npm run build:wasm           # Emscripten Release → public/wasm/ (production)
#   npm run check:dist-wasm      # after `npm run build`: dist/wasm is byte-identical to public/wasm
#   npm run build:wasm:assert    # RelWithAsserts → native/build-assert/
#   WASM_MODULE_PATH=native/build-assert/PhysicsModule.js npm run test:wasm-parity
#   npm run verify:replay        # golden replay tapes, headless Chromium (after build:wasm)

name: Native Physics

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/**'
      - 'src/wasm/**'
      - 'src/config/physics.ts'
      - 'src/game-elements/physics.ts'
      - 'src/game-elements/physics-preload.ts'
      - 'src/engine/wasm-idle-preload.ts'
      - 'tests/wasm-*.test.ts'
      - 'tests/replay-worker-snapshot-wasm.test.ts'
      - 'tests/wasm-*.spec.ts'
      - 'tests/transform-buffer.test.ts'
      - 'tests/helpers/wasm-owner-boot.ts'
      - 'playwright.config.ts'
      - '.emsdk-version'
      - 'scripts/build-wasm.sh'
      - 'scripts/build-wasm-colab.sh'
      - 'scripts/bench-wasm-flags.mjs'
      - 'scripts/run-wasm-parity.mjs'
      - 'scripts/print-wasm-flags.mjs'
      - 'scripts/check-compile-db.mjs'
      - 'scripts/check-wasm-docs.mjs'
      - 'scripts/check-dist-wasm.mjs'
      - 'docs/wasm-physics-engine.md'
      - 'src/game/physics/**'
      - 'src/replay/**'
      - 'tests/replays/**'
      - 'scripts/verify-replay.mjs'
      - 'scripts/lib/**'
      - 'services/replay-verifier/**'
      - 'src/arcade/live-broadcast.ts'
      - 'src/game/live-ui.ts'
      - 'src/display/**'
      - 'tests/live-spectate.spec.ts'
      - 'package.json'
      - '.github/workflows/native-physics.yml'
  pull_request:
    paths:
      - 'native/**'
      - 'src/wasm/**'
      - 'src/config/physics.ts'
      - 'src/game-elements/physics.ts'
      - 'src/game-elements/physics-preload.ts'
      - 'src/engine/wasm-idle-preload.ts'
      - 'tests/wasm-*.test.ts'
      - 'tests/replay-worker-snapshot-wasm.test.ts'
      - 'tests/wasm-*.spec.ts'
      - 'tests/transform-buffer.test.ts'
      - 'tests/helpers/wasm-owner-boot.ts'
      - 'playwright.config.ts'
      - '.emsdk-version'
      - 'scripts/build-wasm.sh'
      - 'scripts/build-wasm-colab.sh'
      - 'scripts/bench-wasm-flags.mjs'
      - 'scripts/run-wasm-parity.mjs'
      - 'scripts/print-wasm-flags.mjs'
      - 'scripts/check-compile-db.mjs'
      - 'scripts/check-wasm-docs.mjs'
      - 'scripts/check-dist-wasm.mjs'
      - 'docs/wasm-physics-engine.md'
      - 'src/game/physics/**'
      - 'src/replay/**'
      - 'tests/replays/**'
      - 'scripts/verify-replay.mjs'
      - 'scripts/lib/**'
      - 'services/replay-verifier/**'
      - 'src/arcade/live-broadcast.ts'
      - 'src/game/live-ui.ts'
      - 'src/display/**'
      - 'tests/live-spectate.spec.ts'
      - 'package.json'
      - '.github/workflows/native-physics.yml'

jobs:
  native_ctest:
    name: Native CTest (Blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++

      - name: Run native Catch2 tests
        run: npm run test:native

      - name: Compile-database smoke (clangd)
        run: npm run check:compile-db

      - name: WASM doc drift check
        run: npm run check:wasm-docs

  # Parity used to be checked only at Debug -O0 on x86-64. The golden traces
  # must come out identical at -O3 and on aarch64, where GCC would fuse a*b+c
  # into FMA without -ffp-contract=off (#487 slice 0). Both jobs are
  # non-blocking for their first week; drop continue-on-error after 2026-11-05.
  native_release_ctest:
    name: Native CTest Release -O3 (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++

      - name: Run native Catch2 tests (Release)
        run: npm run test:native:release

  native_arm64_ctest:
    name: Native CTest aarch64 (non-blocking)
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++

      - name: Run native Catch2 tests (Debug)
        run: npm run test:native

      - name: Run native Catch2 tests (Release)
        run: npm run test:native:release

  # clang, not g++: the sanitizer runtime the WASM toolchain's compiler shares,
  # and float-cast-overflow (an unchecked NaN / ±inf → int cast) is reported
  # as reliably as the rest of UBSan. Pinned to 24.04 so clang-18 and its
  # compiler-rt package match.
  sanitizer_ctest:
    name: Sanitizer CTest (Blocking)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake clang-18 libclang-rt-18-dev

      # Same command locally: PACHINBALL_SANITIZE=ON adds
      # -fsanitize=address,undefined,float-cast-overflow -fno-sanitize-recover=all,
      # so a UBSan report fails the job instead of only printing (#464 item 3).
      - name: Build and run Catch2 under ASan/UBSan (clang)
        env:
          CXX: clang++-18
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          "$CXX" --version
          npm run test:native:san

  wasm_parity:
    name: WASM Build + Parity (Blocking)
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip wasm-ci]') }}
    steps:
      - uses: actions/checkout@v4

      # One pinned SDK (.emsdk-version) for CI and local builds; bumping the
      # pin is a reviewed change that re-runs parity and the bench.
      - name: Cache Emscripten SDK
        uses: actions/cache@v4
        with:
          path: emsdk
          # runner.arch: an arm64 job can never restore (or save) an x64 SDK.
          key: emsdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.emsdk-version') }}

      - name: Install and activate Emscripten
        run: |
          EMSDK_VERSION="$(tr -d '[:space:]' < .emsdk-version)"
          if [ ! -d emsdk ]; then
            git clone https://github.com/emscripten-core/emsdk.git
          fi
          cd emsdk
          git pull --ff-only || true
          ./emsdk install "$EMSDK_VERSION"
          ./emsdk activate "$EMSDK_VERSION"
          source ./emsdk_env.sh
          echo "$(pwd)" >> $GITHUB_PATH
          emcc --version

      - name: Print effective WASM flags
        run: node scripts/print-wasm-flags.mjs

      # Before the build: --emit-tsd needs the repo's tsc.
      - name: Install Node deps
        run: npm ci

      # CI=true makes build-wasm.sh fail on a missing emcmake or tsc, or an
      # emcc that differs from .emsdk-version.
      - name: Build WASM module (Release — production path)
        env:
          CI: 'true'
        run: |
          source emsdk/emsdk_env.sh
          npm run build:wasm

      - name: Generated Embind declarations are committed
        run: |
          if ! git diff --exit-code -- src/wasm/generated; then
            echo "src/wasm/generated/PhysicsModule.d.ts is stale — run npm run build:wasm and commit it"
            exit 1
          fi
          if [ -n "$(git status --porcelain -- src/wasm/generated)" ]; then
            git status --porcelain -- src/wasm/generated
            echo "src/wasm/generated has uncommitted files — run npm run build:wasm and commit them"
            exit 1
          fi

      - name: Assert Release WASM artefact exists
        run: |
          test -s public/wasm/PhysicsModule.wasm
          test -s public/wasm/PhysicsModule.js
          # Production must not ship source maps
          test ! -e public/wasm/PhysicsModule.wasm.map
          test ! -e public/wasm/PhysicsModule.js.map
          echo "WASM size: $(wc -c < public/wasm/PhysicsModule.wasm) bytes"
          # The shipped glue is ENVIRONMENT=web,worker: no Node shims.
          if grep -Eq 'process\.|node:' public/wasm/PhysicsModule.js; then
            echo "public/wasm/PhysicsModule.js carries Node shims (ENVIRONMENT must be web,worker)"
            exit 1
          fi
          # wasm-owner is the only step-exact mode (#444); wasm-worker is opt-in.
          grep -Eq "^\s*defaultEngine: 'wasm-owner'" src/config/physics.ts
          echo "defaultEngine is wasm-owner (wasm-worker is opt-in, #444)"

      # `npm run build` is tsc -b && build:wasm && vite build. Running it (the
      # WASM rebuild is an incremental no-op here) pins the order itself: if
      # vite ever runs first again, dist/wasm holds the previous binary (#464).
      - name: Production build, then dist/wasm must equal public/wasm
        env:
          CI: 'true'
        run: |
          source emsdk/emsdk_env.sh
          npm run build
          npm run check:dist-wasm

      - name: Build RelWithAsserts artefact
        env:
          CI: 'true'
        run: |
          source emsdk/emsdk_env.sh
          npm run build:wasm:assert
          test -s native/build-assert/PhysicsModule.wasm
          test -s native/build-assert/PhysicsModule.js

      - name: Install cmake/g++ for native reference
        run: sudo apt-get update && sudo apt-get install -y cmake g++

      - name: WASM parity against RelWithAsserts
        run: |
          source emsdk/emsdk_env.sh
          WASM_MODULE_PATH=native/build-assert/PhysicsModule.js npm run test:wasm-parity

      - name: Pin field TS resolver vs compiled bundle
        run: RUN_WASM_PARITY=1 WASM_MODULE_PATH=native/build-assert/PhysicsModule.js npx vitest run tests/pin-field-wasm.test.ts

      - name: Replay from a C++ snapshot on the compiled bundle (#422)
        run: RUN_WASM_PARITY=1 WASM_MODULE_PATH=native/build-assert/PhysicsModule.js npx vitest run tests/replay-snapshot-wasm.test.ts

      - name: Replay snapshot round-trip through the worker RPC (#436, worker default #439)
        run: RUN_WASM_PARITY=1 WASM_MODULE_PATH=native/build-assert/PhysicsModule.js npx vitest run tests/replay-worker-snapshot-wasm.test.ts

      - name: Axis-pull force field (MagSpin well) on the compiled bundle
        run: RUN_WASM_PARITY=1 WASM_MODULE_PATH=native/build-assert/PhysicsModule.js npx vitest run tests/axis-pull-field.test.ts

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright wasm-owner + wasm-worker default (feel, debug draw, adventure, toy capture, pin field, MagSpin pull, live spectate)
        env:
          CI: 'true'
        run: >
          npx playwright test --project=chromium
          tests/wasm-owner-flipper.spec.ts
          tests/wasm-owner-debug-draw.spec.ts
          tests/wasm-owner-adventure.spec.ts
          tests/wasm-owner-capture.spec.ts
          tests/wasm-owner-pin-field.spec.ts
          tests/wasm-owner-magspin-pull.spec.ts
          tests/replay-seed-determinism.spec.ts
          tests/wasm-worker-default.spec.ts
          tests/wasm-worker-adventure.spec.ts
          tests/basic-gameplay.spec.ts
          tests/live-spectate.spec.ts

  replay_goldens:
    name: Golden Replay Tapes (Blocking)
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip wasm-ci]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Emscripten SDK
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-${{ runner.os }}-latest

      - name: Install and activate Emscripten
        run: |
          if [ ! -d emsdk ]; then
            git clone https://github.com/emscripten-core/emsdk.git
          fi
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest
          echo "$(pwd)" >> $GITHUB_PATH

      - name: Build WASM module (Release — what the game loads)
        run: |
          source emsdk/emsdk_env.sh
          npm run build:wasm

      - name: Install Node deps
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Each tape: a fresh page on the wasm-owner engine plays it through the
      # spectate path, one fixed step per tape frame, and must land on its
      # golden { finalStateHash, score, steps }.
      - name: Verify golden replay tapes (#444)
        run: npm run verify:replay

      # The storage-host verifier against a production build and a fake
      # Supabase: legitimate runs verify, a forged score, a tape from another
      # board, a worker recording and a missing replay are rejected (#444 Slice C).
      - name: Production build, then the replay verifier self-test
        run: |
          npx vite build
          npm run test:verifier
