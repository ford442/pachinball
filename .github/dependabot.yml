# Dependency updates (#519 C). npm weekly, GitHub Actions monthly. Babylon and TypeScript each come
# as one grouped PR that a person merges by hand: a Babylon bump moves the bundle budget, the shader
# path (WGSL / GLSL) and the frame graphs; a TypeScript bump moves the tsc -b / index-strict
# ratchets. Neither is auto-merged. The Emscripten SDK is pinned in .emsdk-version / .emsdk-commit,
# not here: bumping it changes the shipped wasmSha256 and needs new golden tapes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 (the native port) ships no programmatic API, and typescript-eslint@8.x peers
      # `typescript <6.1.0`: with ~7.0.x, plain `npm ci` fails ERESOLVE and eslint throws
      # "typescript-eslint does not support TS 7.0" (#539 did this to main on 2026-11-19).
      # Stay on ~6.0.x. Lift this ignore (and move package.json off ~6.0.3) only when BOTH hold:
      #   1. typescript-eslint declares TS 7 in its peer range / typed linting works on it
      #      (tracking: https://github.com/typescript-eslint/typescript-eslint/issues/10940), and
      #   2. the migration path is settled: the "Running Side-by-Side with TypeScript 6.0" section of
      #      https://devblogs.microsoft.com/typescript/announcing-typescript-7-0/ (the
      #      @typescript/typescript6 package / tsc6) is how tools that still need the compiler API
      #      keep working while `tsc` runs 7.
      # Minor and patch updates of 6.0.x keep flowing.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      babylon:
        patterns:
          - '@babylonjs/*'
      typescript:
        patterns:
          - 'typescript'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
      dev-tooling:
        dependency-type: development
        exclude-patterns:
          - '@babylonjs/*'
          - 'typescript'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
          - '@playwright/test'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    # The composite action pins actions/cache too.
    directories:
      - /
      - /.github/actions/setup-emsdk
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - '*'
