openapi: 3.1.0
info:
  title: Pachinball live arcade service
  version: 1.0.0
  description: |
    Leaderboard, replays, challenges and saves (#444 Slice B), and live
    spectate streams (Slice E). Plain REST over
    Postgres: reads go to PostgREST, each write path is one Edge Function that
    writes as the caller, and players are Supabase Auth anonymous users.
    Prose and rules: docs/API_CONTRACT.md. Schema: supabase/migrations.
    tests/arcade-contract.test.ts validates every request src/arcade/arcade-api.ts
    makes against this file.
servers:
  - url: https://znsioiaydrtsziwavdat.supabase.co
security:
  - apikey: []
components:
  securitySchemes:
    apikey:
      type: apiKey
      in: header
      name: apikey
      description: The project's publishable key (public; RLS guards the data).
    player:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The player's anonymous-session access token.
    verifier:
      type: apiKey
      in: header
      name: apikey
      description: A secret key (sb_secret_…), held only by the replay verifier on the storage host.
  schemas:
    Tag:
      type: string
      pattern: '^[A-Z]{3}$'
    MapId:
      type: string
      pattern: '^[A-Za-z0-9._:-]{1,64}$'
    Uuid:
      type: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    Session:
      type: object
      required: [access_token, refresh_token, expires_in, user]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer }
        expires_at: { type: integer }
        user:
          type: object
          required: [id]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            is_anonymous: { type: boolean }
    LeaderboardEntry:
      type: object
      required: [rank, name, score, map_id, balls, combo_max, date, verified]
      properties:
        rank: { type: integer, minimum: 1 }
        name: { $ref: '#/components/schemas/Tag' }
        score: { type: integer, minimum: 0 }
        map_id: { $ref: '#/components/schemas/MapId' }
        adventure_level: { type: [string, 'null'] }
        balls: { type: integer }
        combo_max: { type: integer }
        date: { type: string, format: date-time }
        replay_id: { type: [string, 'null'] }
        challenge_id: { type: [string, 'null'] }
        verified: { type: boolean }
        verification: { enum: [verified, pending] }
    ScoreSubmission:
      type: object
      additionalProperties: false
      required: [name, score, map_id]
      properties:
        name: { $ref: '#/components/schemas/Tag' }
        score: { type: integer, minimum: 0, maximum: 1000000000000 }
        map_id: { $ref: '#/components/schemas/MapId' }
        adventure_level: { type: [string, 'null'], pattern: '^[A-Za-z0-9._:-]{1,64}$' }
        balls: { type: integer, minimum: 0, maximum: 99 }
        combo_max: { type: integer, minimum: 0, maximum: 1000000 }
        replay_id: { $ref: '#/components/schemas/Uuid' }
        challenge_id: { $ref: '#/components/schemas/Uuid' }
    ReplayPayload:
      description: ReplayRecorder.toJSON(payload) — at most 512 KB (MAX_PAYLOAD_SIZE_BYTES).
      type: object
      required: [version, seed, mapId, physicsEngine, finalScore]
      anyOf:
        - required: [compressedFrames]
        - required: [frames]
      properties:
        version: { type: integer, minimum: 1 }
        buildId: { type: string }
        mapId: { type: string }
        seed: { type: integer, minimum: 0, maximum: 4294967295 }
        physicsEngine: { enum: [rapier, wasm-mirror, wasm-owner, wasm-worker] }
        renderer: { enum: [webgl2, webgpu] }
        createdAt: { type: string }
        finalScore: { type: integer, minimum: 0 }
        targetScore: { type: integer }
        frames: { type: array }
        compressedFrames: { type: string }
        snapshotVersion: { type: integer }
        staticHash: { type: [string, 'null'] }
        pinFieldOccupancy: { type: [string, 'null'] }
        feederTunablesHash: { type: string }
        initialSnapshot: { type: string }
        cascade:
          type: object
          required: [mode, seed, seedId]
          properties:
            mode: { enum: [daily, free] }
            seed: { type: integer }
            seedId: { type: string }
    ChallengeRequest:
      type: object
      additionalProperties: false
      required: [seed, targetScore, mapId]
      properties:
        seed: { type: integer, minimum: 0, maximum: 4294967295 }
        targetScore: { type: integer, minimum: 0, maximum: 1000000000000 }
        mapId: { $ref: '#/components/schemas/MapId' }
        challengerName: { $ref: '#/components/schemas/Tag' }
        replayId: { $ref: '#/components/schemas/Uuid' }
        cascadeSeed: { type: integer, minimum: 0, maximum: 4294967295 }
    Challenge:
      type: object
      required: [id, kind, seed, map_id, target_score, starts_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { enum: [player, weekly] }
        seed: { type: integer, minimum: 0, maximum: 4294967295 }
        map_id: { type: string }
        target_score: { type: integer, minimum: 0 }
        challenger_name: { type: [string, 'null'] }
        replay_id: { type: [string, 'null'] }
        cascade_seed: { type: [integer, 'null'] }
        board: { type: [string, 'null'] }
        title: { type: [string, 'null'] }
        starts_at: { type: string }
        expires_at: { type: [string, 'null'] }
        creator_id: { type: [string, 'null'] }
        created_at: { type: string }
    GhostTrack:
      type: object
      required: [stride, samples, track]
      properties:
        stride: { type: integer, minimum: 1, maximum: 60 }
        samples: { type: integer, minimum: 0 }
        track: { type: string, description: 'Base64 of little-endian Int32 millimetre (x, y, z) triples of the primary ball; x = INT32_MIN when there is no ball' }
    LiveRun:
      type: object
      required: [id, map_id, player_tag, chunk_steps, track_stride, chunks, frames, score, status, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        map_id: { type: string }
        player_tag: { type: [string, 'null'], pattern: '^[A-Z]{3}$' }
        chunk_steps: { type: integer, minimum: 60, maximum: 600 }
        track_stride: { type: integer, minimum: 1, maximum: 10 }
        chunks: { type: integer, minimum: 0 }
        frames: { type: integer, minimum: 0, maximum: 216000 }
        score: { type: integer, minimum: 0 }
        status: { enum: [live, left, ended], description: 'live: streaming; left: the player started another run; ended: its final chunk is stored' }
        created_at: { type: string }
        updated_at: { type: string }
        header: { type: object, description: 'ReplayRecorder metadata at frame 0 (wasm-owner, with initialSnapshot), without frames' }
    LiveChunk:
      type: object
      required: [seq, start_frame, frame_count, frames, state_hash, score, track, final]
      properties:
        seq: { type: integer, minimum: 0, maximum: 3600 }
        start_frame: { type: integer, minimum: 0 }
        frame_count: { type: integer, minimum: 0, maximum: 600 }
        frames: { type: string, description: 'RLE rows (compressInputFrames) for frames [start_frame, start_frame + frame_count)' }
        state_hash: { type: string, pattern: '^[0-9a-f]{16}$', description: "The C++ world's getStateHash after the chunk's last step" }
        score: { type: integer, minimum: 0, description: "The score after the chunk's last step" }
        track: { type: [string, 'null'], description: "Base64 Int32 millimetre triples of the primary ball, one every track_stride steps (x = INT32_MIN: no ball)" }
        final: { type: boolean }
    SaveRequest:
      type: object
      additionalProperties: false
      required: [schema_version, data]
      properties:
        slot: { type: string, pattern: '^[a-z0-9-]{1,32}$' }
        schema_version: { type: integer, minimum: 1 }
        data: { type: object }
    Failure:
      type: object
      required: [success, message]
      properties:
        success: { const: false }
        message: { type: string }
  responses:
    Failure:
      description: Refused — validation (400), not signed in (401), not yours (403), too large (413), rate limit (429).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Failure' }
paths:
  /auth/v1/signup:
    post:
      summary: Start an anonymous player session
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, maxProperties: 0 }
      responses:
        '200':
          description: The new session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
  /auth/v1/token:
    post:
      summary: Refresh a player session
      parameters:
        - { name: grant_type, in: query, required: true, schema: { const: refresh_token } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refresh_token]
              properties:
                refresh_token: { type: string, minLength: 1 }
      responses:
        '200':
          description: The refreshed session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
  /rest/v1/leaderboard:
    get:
      summary: One board, best first
      parameters:
        - { name: select, in: query, required: true, schema: { type: string } }
        - { name: map_id, in: query, required: true, schema: { type: string, pattern: '^eq\.[A-Za-z0-9._:-]{1,64}$' } }
        - { name: adventure_level, in: query, required: true, schema: { type: string, pattern: '^(is\.null|eq\.[A-Za-z0-9._:-]{1,64})$' } }
        - { name: order, in: query, required: true, schema: { const: rank.asc } }
        - { name: limit, in: query, required: true, schema: { type: string, pattern: '^([1-9]|[1-9][0-9]|100)$' } }
        - { name: verified, in: query, required: false, schema: { const: is.true } }
      responses:
        '200':
          description: Leaderboard rows.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LeaderboardEntry' }
  /rest/v1/rpc/player_rank:
    post:
      summary: Where a score would place (1 = top)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [p_map_id, p_score]
              properties:
                p_map_id: { $ref: '#/components/schemas/MapId' }
                p_score: { type: integer, minimum: 0 }
                p_adventure_level: { type: [string, 'null'] }
      responses:
        '200':
          description: The rank.
          content:
            application/json:
              schema: { type: integer, minimum: 1 }
  /rest/v1/replays:
    get:
      summary: A stored replay's payload
      parameters:
        - { name: select, in: query, required: true, schema: { const: payload } }
        - { name: id, in: query, required: true, schema: { type: string, pattern: '^eq\.[0-9a-f-]{36}$' } }
      responses:
        '200':
          description: Zero or one row.
          content:
            application/json:
              schema:
                type: array
                maxItems: 1
                items:
                  type: object
                  required: [payload]
                  properties:
                    payload: { $ref: '#/components/schemas/ReplayPayload' }
  /rest/v1/saves:
    get:
      summary: The player's own save slot (a linked device reads the player's)
      security: [{ apikey: [], player: [] }]
      parameters:
        - { name: select, in: query, required: true, schema: { const: 'slot,schema_version,data,updated_at' } }
        - { name: slot, in: query, required: true, schema: { type: string, pattern: '^eq\.[a-z0-9-]{1,32}$' } }
      responses:
        '200':
          description: Zero or one save.
          content:
            application/json:
              schema:
                type: array
                maxItems: 1
                items:
                  type: object
                  required: [slot, schema_version, data, updated_at]
                  properties:
                    slot: { type: string }
                    schema_version: { type: integer }
                    data: { type: object }
                    updated_at: { type: string }
  /rest/v1/rpc/create_device_link:
    post:
      summary: A one-time code (10 minutes, 5 an hour) that links another device to this player's saves
      security: [{ apikey: [], player: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, maxProperties: 0 }
      responses:
        '200':
          description: The code.
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                maxItems: 1
                items:
                  type: object
                  required: [code, expires_at]
                  properties:
                    code: { type: string, pattern: '^[A-HJ-NP-Z2-9]{8}$' }
                    expires_at: { type: string }
  /rest/v1/rpc/redeem_device_link:
    post:
      summary: Link this device to the player behind a code (10 failed codes an hour)
      security: [{ apikey: [], player: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [p_code]
              properties:
                p_code: { type: string, pattern: '^[A-Za-z0-9]{8}$' }
      responses:
        '200':
          description: The player this device now saves as, or null for an unknown, used or expired code.
          content:
            application/json:
              schema: { type: [string, 'null'] }
  /rest/v1/challenges:
    get:
      summary: A challenge
      parameters:
        - { name: select, in: query, required: true, schema: { type: string } }
        - { name: id, in: query, required: true, schema: { type: string, pattern: '^eq\.[0-9a-f-]{36}$' } }
      responses:
        '200':
          description: Zero or one challenge.
          content:
            application/json:
              schema:
                type: array
                maxItems: 1
                items: { $ref: '#/components/schemas/Challenge' }
  /rest/v1/rpc/current_weekly_challenge:
    post:
      summary: This ISO week's table of the week (created on first ask)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, maxProperties: 0 }
      responses:
        '200':
          description: The week's challenge.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Challenge' }
  /rest/v1/ghost_tracks:
    get:
      summary: The verifier's recording of a verified run's ball (the race ghost)
      parameters:
        - { name: select, in: query, required: true, schema: { const: 'stride,samples,track' } }
        - { name: replay_id, in: query, required: true, schema: { type: string, pattern: '^eq\.[0-9a-f-]{36}$' } }
      responses:
        '200':
          description: Zero or one track.
          content:
            application/json:
              schema:
                type: array
                maxItems: 1
                items: { $ref: '#/components/schemas/GhostTrack' }
  /rest/v1/rpc/live_start:
    post:
      summary: Open a live run (wasm-owner tapes with a frame-0 snapshot; unlists the player's previous run; 30 an hour)
      security: [{ apikey: [], player: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [p_header, p_map_id]
              properties:
                p_header:
                  type: object
                  required: [physicsEngine, initialSnapshot, seed, mapId]
                  properties:
                    physicsEngine: { const: wasm-owner }
                    initialSnapshot: { type: string, minLength: 1 }
                    seed: { type: integer, minimum: 0, maximum: 4294967295 }
                    mapId: { type: string }
                p_map_id: { $ref: '#/components/schemas/MapId' }
                p_tag: { type: [string, 'null'], pattern: '^[A-Z]{3}$' }
                p_chunk_steps: { type: integer, minimum: 60, maximum: 600 }
                p_track_stride: { type: integer, minimum: 1, maximum: 10 }
      responses:
        '200':
          description: The run's id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Uuid' }
  /rest/v1/rpc/live_append:
    post:
      summary: Append the next chunk of a live run (in order; full until the final one; a resend of a stored chunk is accepted; no faster than real time plus 30 s)
      security: [{ apikey: [], player: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [p_live_id, p_seq, p_frames, p_frame_count, p_state_hash, p_score, p_final]
              properties:
                p_live_id: { $ref: '#/components/schemas/Uuid' }
                p_seq: { type: integer, minimum: 0, maximum: 3600 }
                p_frames: { type: string }
                p_frame_count: { type: integer, minimum: 0, maximum: 600 }
                p_state_hash: { type: string, pattern: '^[0-9a-f]{16}$' }
                p_score: { type: integer, minimum: 0 }
                p_track: { type: [string, 'null'] }
                p_final: { type: boolean }
      responses:
        '200':
          description: Frames streamed so far (409 out of order or after the final chunk, 429 faster than real time).
          content:
            application/json:
              schema: { type: integer, minimum: 0 }
  /rest/v1/live_now:
    get:
      summary: Runs streaming now (something sent in the last 45 seconds), most recently updated first
      parameters:
        - { name: select, in: query, required: true, schema: { const: 'id,map_id,player_tag,chunk_steps,track_stride,chunks,frames,score,status,created_at,updated_at' } }
        - { name: order, in: query, schema: { const: updated_at.desc } }
        - { name: limit, in: query, schema: { type: string, pattern: '^[0-9]{1,3}$' } }
      responses:
        '200':
          description: Live runs.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LiveRun' }
  /rest/v1/replays_live:
    get:
      summary: A live (or finished) run with its frame-0 header
      parameters:
        - { name: select, in: query, required: true, schema: { const: 'id,map_id,player_tag,chunk_steps,track_stride,chunks,frames,score,status,created_at,updated_at,header' } }
        - { name: id, in: query, required: true, schema: { type: string, pattern: '^eq\.[0-9a-f-]{36}$' } }
      responses:
        '200':
          description: Zero or one run.
          content:
            application/json:
              schema:
                type: array
                maxItems: 1
                items: { $ref: '#/components/schemas/LiveRun' }
  /rest/v1/replays_live_chunks:
    get:
      summary: A live run's chunks from a sequence number on, in order
      parameters:
        - { name: select, in: query, required: true, schema: { const: 'seq,start_frame,frame_count,frames,state_hash,score,track,final' } }
        - { name: live_id, in: query, required: true, schema: { type: string, pattern: '^eq\.[0-9a-f-]{36}$' } }
        - { name: seq, in: query, required: true, schema: { type: string, pattern: '^gte\.[0-9]{1,4}$' } }
        - { name: order, in: query, required: true, schema: { const: seq.asc } }
        - { name: limit, in: query, schema: { type: string, pattern: '^[0-9]{1,3}$' } }
      responses:
        '200':
          description: Chunks.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LiveChunk' }
  /functions/v1/submit-score:
    post:
      summary: Submit a leaderboard entry (stored unverified)
      security: [{ apikey: [], player: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScoreSubmission' }
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema:
                type: object
                required: [success, score_id, rank, verified]
                properties:
                  success: { const: true }
                  score_id: { type: integer }
                  rank: { type: integer, minimum: 1 }
                  verified: { const: false }
        default: { $ref: '#/components/responses/Failure' }
  /functions/v1/submit-replay:
    post:
      summary: Upload a replay tape (at most 512 KB)
      security: [{ apikey: [], player: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplayPayload' }
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema:
                type: object
                required: [success, replay_id, frame_count]
                properties:
                  success: { const: true }
                  replay_id: { $ref: '#/components/schemas/Uuid' }
                  frame_count: { type: integer, minimum: 0 }
        default: { $ref: '#/components/responses/Failure' }
  /functions/v1/create-challenge:
    post:
      summary: Register a seed + target challenge
      security: [{ apikey: [], player: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChallengeRequest' }
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema:
                type: object
                required: [success, challenge_id]
                properties:
                  success: { const: true }
                  challenge_id: { $ref: '#/components/schemas/Uuid' }
        default: { $ref: '#/components/responses/Failure' }
  /functions/v1/put-save:
    post:
      summary: Upsert the caller's save slot (private)
      security: [{ apikey: [], player: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveRequest' }
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema:
                type: object
                required: [success, slot, schema_version, updated_at]
                properties:
                  success: { const: true }
                  slot: { type: string }
                  schema_version: { type: integer }
                  updated_at: { type: string }
        default: { $ref: '#/components/responses/Failure' }
  /rest/v1/rpc/claim_score_verifications:
    post:
      summary: 'Verifier only: claim pending scores, oldest first, with their tapes'
      security: [{ verifier: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                p_limit: { type: integer, minimum: 1, maximum: 32 }
                p_stale: { type: string, description: 'Postgres interval; a claim older than this is handed out again (default 15 minutes)' }
      responses:
        '200':
          description: The claimed scores (each claim counts an attempt).
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [score_id, score, map_id, replay_id, payload, physics_engine, attempts, submitted_at]
                  properties:
                    score_id: { type: integer }
                    score: { type: integer }
                    map_id: { type: string }
                    replay_id: { type: [string, 'null'] }
                    payload: { oneOf: [{ $ref: '#/components/schemas/ReplayPayload' }, { type: 'null' }] }
                    physics_engine: { type: [string, 'null'] }
                    attempts: { type: integer }
                    submitted_at: { type: string, format: date-time }
  /rest/v1/rpc/record_score_verification:
    post:
      summary: 'Verifier only: record a verdict'
      security: [{ verifier: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [p_score_id, p_verified, p_verifier_version, p_verifier_score, p_reason, p_state_hash]
              properties:
                p_score_id: { type: integer }
                p_verified: { type: boolean }
                p_verifier_version: { type: string }
                p_verifier_score: { type: [integer, 'null'] }
                p_reason: { type: [string, 'null'] }
                p_state_hash: { type: [string, 'null'] }
      responses:
        '204':
          description: Recorded.
